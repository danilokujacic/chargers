[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"      # or "single"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Session-scoped so the database connection, the in-process server, and every test share one
# event loop -- required for the session-scoped db/server fixtures in tests/conftest.py.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"