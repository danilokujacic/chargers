# Production stack for the charging platform. Run it through the Makefile (`make help`), which
# passes --env-file .env.production (created by `make setup`).
#
#   caddy ── https://DOMAIN ───────▶ frontend (Next.js) ─┐
#     │   └─ https://DOMAIN/api/* ─▶ api (FastAPI) ──────┼──▶ mongo
#     └──── wss://OCPP_DOMAIN ─────▶ cs (main.py) ───────┘   redis (events: cs ─▶ api)
#
# MongoDB and Redis are only reachable inside this network. The Central System's own port is
# published on CS_BIND (127.0.0.1 by default) for chargers that cannot do TLS; see DEPLOY.md.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend-env: &backend-env
  MONGODB_URL: mongodb://${MONGO_ROOT_USER:?run make setup}:${MONGO_ROOT_PASSWORD:?run make setup}@mongo:27017/?authSource=admin
  MONGODB_DB: ${MONGODB_DB:-ocpp_poc}
  REDIS_URL: redis://:${REDIS_PASSWORD:?run make setup}@redis:6379/0

x-backend: &backend
  image: chargers-backend:latest
  restart: unless-stopped
  logging: *logging
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging

  redis:
    # Only carries live events from the Central System to the API; nothing is stored in it,
    # so persistence is off.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  cs:
    <<: *backend
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    command: ["python", "-u", "main.py"]
    environment:
      <<: *backend-env
      ADMIN_TOKEN: ${ADMIN_TOKEN:?run make setup}
      FIRMWARE_BASE_URL: ${FIRMWARE_BASE_URL:-http://localhost:9000}
    ports:
      - "${CS_BIND:-127.0.0.1}:${CS_PORT:-9000}:9000"
    volumes:
      - ./firmware_files:/app/firmware_files:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9000), 3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    <<: *backend
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      <<: *backend-env
      CORS_ORIGINS: ${PUBLIC_URL:?run make setup}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/sites', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  frontend:
    image: chargers-frontend:latest
    build:
      context: ${FRONTEND_DIR:?run make setup}
      dockerfile: ${FRONTEND_DOCKERFILE:?run make setup}
      args:
        NEXT_PUBLIC_MAPTILER_API_KEY: ${MAPTILER_KEY:?run make setup}
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_WS_BASE_URL: ${PUBLIC_WS_URL:?run make setup}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://127.0.0.1:3000/favicon.ico').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - api
      - cs
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?run make setup}
      OCPP_SITE_ADDRESS: ${OCPP_SITE_ADDRESS:-ocpp.localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        # The website renders its first view on the server, fetching PUBLIC_URL/api/v1/sites.
        # This alias makes DOMAIN resolve to Caddy inside the network, so that request never
        # has to leave the machine.
        aliases:
          - ${DOMAIN:?run make setup}
    logging: *logging

  # Demo only: 195 simulated chargers (instructions/11-demo-fleet.md). `make demo-up`.
  fleet:
    <<: *backend
    profiles: ["demo"]
    command: ["python", "-u", "run_demo_fleet.py", "--url", "ws://cs:9000",
              "--manifest", "/data/demo_fleet_manifest.json",
              "--state-file", "/data/demo_fleet_state.json"]
    depends_on:
      cs:
        condition: service_healthy
    volumes:
      - app-data:/data
    # SIGTERM makes the fleet end every session and switch its chargers off (up to 20 s).
    stop_grace_period: 30s

  # One-off commands: migrations, seeds, operator CLIs (`make migrate`, `make operate ...`).
  tools:
    <<: *backend
    profiles: ["tools"]
    restart: "no"
    command: ["python", "migrate.py", "--status"]
    environment:
      <<: *backend-env
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADMIN_URL: http://cs:9000
    volumes:
      - app-data:/data

volumes:
  mongo-data:
  app-data:
  caddy-data:
  caddy-config:
